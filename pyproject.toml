[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eosed"
version = "0.1.0"
description = "Terminal editor for the E-mu EOS sampler family (E4/E4XT) over MIDI SysEx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Jan Lentfer" }]
keywords = ["midi", "sysex", "sampler", "emu", "eos", "e4xt", "tui"]
# No "License :: OSI Approved :: ..." entry: the `license` field above already
# carries the SPDX expression, and PEP 639 deprecates stating it twice.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # Install, demo mode and the suite are CI-verified on all three; only
    # live-hardware use is Linux-only-tested (see README, "Platform notes").
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware",
]
dependencies = [
    "textual>=0.80",
    "python-rtmidi>=1.5",
]

[project.urls]
Homepage = "https://github.com/lentferj/eosed"
Source = "https://github.com/lentferj/eosed"
Issues = "https://github.com/lentferj/eosed/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
eosed = "eosed.app:main"
eoscli = "eosed.cli:main"

[tool.setuptools]
packages = ["eos", "eosed"]
# Explicit rather than relying on setuptools' default glob: GPL-2 §1 requires
# the licence text to travel with the program, so COPYING must never silently
# drop out of a built distribution.
license-files = ["LICENSE", "COPYING"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
