[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eosed"
version = "0.1.0"
description = "Terminal editor for the E-mu EOS sampler family (E4/E4XT) over MIDI SysEx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Jan Lentfer", email = "jan.lentfer@web.de" }]
dependencies = [
    "textual>=0.80",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
eosed = "eosed.app:main"
eoscli = "eosed.cli:main"

[tool.setuptools]
packages = ["eos", "eosed"]
# Explicit rather than relying on setuptools' default glob: GPL-2 §1 requires
# the licence text to travel with the program, so COPYING must never silently
# drop out of a built distribution.
license-files = ["LICENSE", "COPYING"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
