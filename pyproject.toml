[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eosed"
version = "0.1.0"
description = "Terminal editor for the E-mu EOS sampler family (E4/E4XT) over MIDI SysEx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Jan Lentfer" }]
keywords = ["midi", "sysex", "sampler", "emu", "eos", "e4xt", "tui"]
# No "License :: OSI Approved :: ..." entry: the `license` field above already
# carries the SPDX expression, and PEP 639 deprecates stating it twice.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # Install, demo mode and the suite are CI-verified on all three; only
    # live-hardware use is Linux-only-tested (see README, "Platform notes").
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware",
]
dependencies = [
    "textual>=0.80",
    "python-rtmidi>=1.5",
    # The shared base of this family of terminal instrument browsers: the
    # settings cache, the keymap and legend, the parser, the port listing.
    # eosed is an EDITOR and so has no favourites store -- see
    # docs/UX-SPEC.md -- but it has everything else, and had its own copy of
    # all of it. That copy is where this project's real bug lived: the
    # settings writer emitted string values unescaped.
    "vinsynlib",
]

# vinsynlib is not on PyPI. It is the shared base of this family of terminal
# instrument browsers and lives in a sibling checkout, so it is installed from
# the working tree rather than from an index. Editable, because a change to
# the library is a change here and should not need a reinstall to see.
[tool.uv.sources]
vinsynlib = { path = "../vinsynlib", editable = true }

[project.urls]
Homepage = "https://github.com/lentferj/eosed"
Source = "https://github.com/lentferj/eosed"
Issues = "https://github.com/lentferj/eosed/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "mypy>=1.15",
    "pip-audit>=2.7",
    "vulture>=2.14",
    "deptry>=0.25",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
]

[project.scripts]
eosed = "eosed.app:main"
eoscli = "eosed.cli:main"

[tool.setuptools]
packages = ["eos", "eosed"]
# Explicit rather than relying on setuptools' default glob: GPL-2 §1 requires
# the licence text to travel with the program, so COPYING must never silently
# drop out of a built distribution.
license-files = ["LICENSE", "COPYING"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=eos --cov=eosed --cov-report=term-missing --cov-report=xml"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["bench/", "probes/", "tools/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "SIM", "UP", "C4", "PL", "RUF", "C901"]
ignore = [
    # --- Genuine style preferences (not bugs, would require mass-fixing) ---
    "E501",    # line-too-long: handled by formatter, not linter
    "S101",    # assert: allowed in tests (see per-file-ignores below)
    "UP006",   # use `list` instead of `List` (mass-fix, not a bug)
    "UP035",   # import from collections.abc (mass-fix, not a bug)
    "UP037",   # remove quotes from type annotation (mass-fix, not a bug)
    "UP045",   # use `X | None` for type annotations (mass-fix, not a bug)
    "PLC0415", # import should be at top-level (mass-fix, not a bug)
    # --- Complexity / design preferences ---
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-locals
    "PLR2004",  # magic-value-comparison
    # --- Unicode / style ---
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "RUF012",  # mutable-class-default
    "RUF013",  # implicit-optional
    # --- Simplification suggestions ---
    "SIM108",  # if-else-block-instead-of-ternary
    "SIM117",  # multiple-with-statements
    # --- Comprehension style ---
    "C408",    # unnecessary-dict-call
    "C416",    # unnecessary-comprehension
    "C419",    # unnecessary-comprehension-in-call
    # --- Bugbear exceptions ---
    "B008",    # function-call-in-default-argument
    "B023",    # function-uses-loop-variable
    "B905",    # zip-without-explicit-strict
    "B909",    # loop-iterator-mutation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.ruff.lint.isort]
# vinsynlib is listed as first-party rather than third-party because it is: a
# sibling checkout of this same family, developed alongside eosed rather than
# vendored from an index. Left out, ruff sorts its imports into a separate
# third-party block and the family's own code ends up visually separated from
# eosed's, which is the opposite of what it is.
known-first-party = ["eos", "eosed", "vinsynlib"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["bench/", "probes/", "tools/"]

# python-rtmidi ships no stubs or py.typed marker; the boundary is Any and
# the casts at the two enumeration call sites document what we rely on.
[[tool.mypy.overrides]]
module = "rtmidi"
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["eos/", "eosed/"]

[tool.deptry]
# Existing violations baselined (16 findings)
# These are pre-existing dependency issues that would require mass-fixing.
# New dependencies should be properly declared.
ignore = ["DEP001", "DEP002", "DEP003"]
